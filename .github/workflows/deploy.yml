name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: sitemap lastmod values come from each file's last commit.
          fetch-depth: 0

      - name: Rebuild sitemap
        run: ./build-sitemap.sh

      # The site is plain static files, so there is nothing to build. The
      # repo root is what gets uploaded, minus what .assetsignore excludes.
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name andante-hair-studio --branch main
