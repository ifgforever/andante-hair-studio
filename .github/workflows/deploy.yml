name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: sitemap lastmod values come from each file's last commit.
          fetch-depth: 0

      - name: Rebuild sitemap
        run: ./build-sitemap.sh

      # Stage only site files. Deploying the repo root published README.md and
      # the shell scripts, and Pages does not honour .assetsignore.
      - name: Stage site
        run: ./build-site.sh

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name andante-hair-studio --branch main
